<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="Command palette opened with Cmd+K">
  <defs>
    <linearGradient id="dimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e1e13" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2e1e13" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="paletteShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="32" flood-color="#1f1815" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- dimmed canvas (warm cream behind) -->
  <rect width="1280" height="800" fill="#faf9f5"/>

  <!-- ghosted ui underneath -->
  <g opacity="0.35">
    <rect x="0" y="0" width="228" height="800" fill="#1d1612"/>
    <rect x="248" y="22" width="600" height="40" rx="12" fill="#e7dfcf"/>
    <rect x="248" y="116" width="320" height="76" rx="18" fill="#ffffff" stroke="#e7dfcf"/>
    <rect x="584" y="116" width="320" height="76" rx="18" fill="#ffffff" stroke="#e7dfcf"/>
    <rect x="248" y="220" width="660" height="320" rx="22" fill="#ffffff" stroke="#e7dfcf"/>
  </g>

  <!-- overlay -->
  <rect width="1280" height="800" fill="url(#dimGrad)"/>

  <!-- palette panel -->
  <g transform="translate(360, 100)" filter="url(#paletteShadow)">
    <rect x="0" y="0" width="560" height="540" rx="18" fill="#ffffff" stroke="#e7dfcf"/>

    <!-- search row -->
    <g transform="translate(0, 0)">
      <line x1="20" y1="60" x2="540" y2="60" stroke="#e7dfcf"/>
      <text x="22" y="35" font-family="Inter, sans-serif" font-size="16" fill="#7a665a">⌕</text>
      <text x="46" y="38" font-family="Inter, sans-serif" font-size="15" fill="#1f1815">theme</text>
      <!-- esc kbd -->
      <g transform="translate(496, 22)">
        <rect x="0" y="0" width="32" height="22" rx="6" fill="#f5f1e8" stroke="#e7dfcf"/>
        <text x="16" y="16" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#1f1815">esc</text>
      </g>
    </g>

    <!-- group: Appearance -->
    <text x="22" y="86" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#7a665a">APPEARANCE</text>

    <!-- active item -->
    <g transform="translate(8, 96)">
      <rect x="0" y="0" width="544" height="40" rx="14" fill="#f1ddd1"/>
      <text x="14" y="25" font-family="Inter, sans-serif" font-size="14" fill="#6b3320">Theme: Dark</text>
      <text x="500" y="25" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#7a665a">Appearance</text>
    </g>

    <g transform="translate(8, 144)">
      <rect x="0" y="0" width="544" height="40" rx="14" fill="transparent"/>
      <text x="14" y="25" font-family="Inter, sans-serif" font-size="14" fill="#1f1815">Theme: Match system</text>
      <text x="500" y="25" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#7a665a">Appearance</text>
    </g>

    <g transform="translate(8, 188)">
      <text x="14" y="25" font-family="Inter, sans-serif" font-size="14" fill="#1f1815">Toggle theme</text>
      <text x="500" y="25" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#7a665a">Appearance</text>
    </g>

    <g transform="translate(8, 224)">
      <text x="14" y="25" font-family="Inter, sans-serif" font-size="14" fill="#1f1815">Motion: reduce animations</text>
      <text x="500" y="25" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#7a665a">Appearance</text>
    </g>

    <!-- group: Workspace -->
    <text x="22" y="278" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#7a665a">WORKSPACE</text>
    <g transform="translate(8, 286)">
      <text x="14" y="25" font-family="Inter, sans-serif" font-size="14" fill="#1f1815">Pin current view to watchlist</text>
      <text x="500" y="25" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#7a665a">Workspace</text>
    </g>
    <g transform="translate(8, 322)">
      <text x="14" y="25" font-family="Inter, sans-serif" font-size="14" fill="#1f1815">Open watchlist</text>
      <text x="500" y="25" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#7a665a">Workspace</text>
    </g>
    <g transform="translate(8, 358)">
      <text x="14" y="25" font-family="Inter, sans-serif" font-size="14" fill="#1f1815">Open backtest archive</text>
      <text x="500" y="25" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#7a665a">Workspace</text>
    </g>

    <!-- group: Export -->
    <text x="22" y="410" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#7a665a">EXPORT</text>
    <g transform="translate(8, 418)">
      <text x="14" y="25" font-family="Inter, sans-serif" font-size="14" fill="#1f1815">Export current view as PDF…</text>
      <text x="500" y="25" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#7a665a">Export</text>
    </g>
    <g transform="translate(8, 454)">
      <text x="14" y="25" font-family="Inter, sans-serif" font-size="14" fill="#1f1815">Export app diagnostics as Markdown…</text>
      <text x="500" y="25" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#7a665a">Export</text>
    </g>

    <!-- footer -->
    <line x1="0" y1="500" x2="560" y2="500" stroke="#e7dfcf"/>
    <rect x="0" y="500" width="560" height="40" rx="0" fill="#f5f1e8"/>
    <g transform="translate(20, 510)" font-family="Inter, sans-serif" font-size="11" fill="#7a665a">
      <text x="0" y="20">↑↓ navigate</text>
    </g>
    <g transform="translate(360, 510)" font-family="Inter, sans-serif" font-size="11" fill="#7a665a">
      <text x="0" y="20">↵ run · </text>
      <text x="50" y="20">⌘ K to toggle</text>
    </g>
  </g>

  <!-- caption -->
  <g transform="translate(360, 670)" font-family="Inter, sans-serif">
    <text x="280" y="0" text-anchor="middle" font-size="13" fill="#7a665a">⌘K opens the command palette · 25+ commands across 8 groups</text>
    <text x="280" y="22" text-anchor="middle" font-size="13" fill="#7a665a">Theme · Language · Workspace · Export · Updates · Privacy · Diagnostics · Help</text>
  </g>
</svg>

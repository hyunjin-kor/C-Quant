<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="Watchlist drawer slid in from the right">
  <defs>
    <linearGradient id="dimWatch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e1e13" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#2e1e13" stop-opacity="0.50"/>
    </linearGradient>
    <filter id="watchShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="32" flood-color="#1f1815" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- canvas + ghost ui -->
  <rect width="1280" height="800" fill="#faf9f5"/>
  <g opacity="0.4">
    <rect x="0" y="0" width="228" height="800" fill="#1d1612"/>
    <rect x="248" y="22" width="600" height="52" rx="12" fill="#e7dfcf"/>
    <rect x="248" y="116" width="320" height="76" rx="18" fill="#ffffff" stroke="#e7dfcf"/>
    <rect x="584" y="116" width="320" height="76" rx="18" fill="#ffffff" stroke="#e7dfcf"/>
    <rect x="248" y="220" width="660" height="320" rx="22" fill="#ffffff" stroke="#e7dfcf"/>
  </g>

  <rect width="1280" height="800" fill="url(#dimWatch)"/>

  <!-- drawer panel -->
  <g transform="translate(860, 0)" filter="url(#watchShadow)">
    <rect x="0" y="0" width="420" height="800" fill="#ffffff"/>
    <rect x="0" y="0" width="1" height="800" fill="#e7dfcf"/>

    <!-- head -->
    <g transform="translate(20, 22)">
      <text x="0" y="32" font-family="Fraunces, serif" font-size="22" font-weight="500" letter-spacing="-0.5" fill="#1f1815">Watchlist</text>
      <g transform="translate(360, 6)">
        <rect x="0" y="0" width="24" height="24" rx="12" fill="transparent"/>
        <text x="12" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" fill="#7a665a">×</text>
      </g>
    </g>
    <line x1="20" y1="76" x2="400" y2="76" stroke="#e7dfcf"/>

    <!-- list -->
    <g transform="translate(12, 92)" font-family="Inter, sans-serif">
      <!-- row 1 -->
      <g>
        <rect x="0" y="0" width="356" height="62" rx="14" fill="#ffffff" stroke="#e7dfcf"/>
        <text x="14" y="22" font-size="14" font-weight="600" fill="#1f1815">EU-ETS · command</text>
        <text x="14" y="42" font-size="11" fill="#7a665a">2026-04-29 14:18 · primary anchor + ICE Dec</text>
        <g transform="translate(360, 12)">
          <rect x="0" y="0" width="40" height="40" rx="10" fill="#ffffff" stroke="#e7dfcf"/>
          <text x="20" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#7a665a">×</text>
        </g>
      </g>
      <!-- row 2 -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="356" height="62" rx="14" fill="#ffffff" stroke="#e7dfcf"/>
        <text x="14" y="22" font-size="14" font-weight="600" fill="#1f1815">K-ETS · desk</text>
        <text x="14" y="42" font-size="11" fill="#7a665a">2026-04-28 09:42 · KRX bydd_trd · KRBN proxy</text>
        <g transform="translate(360, 12)">
          <rect x="0" y="0" width="40" height="40" rx="10" fill="#ffffff" stroke="#e7dfcf"/>
          <text x="20" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#7a665a">×</text>
        </g>
      </g>
      <!-- row 3 -->
      <g transform="translate(0, 144)">
        <rect x="0" y="0" width="356" height="62" rx="14" fill="#ffffff" stroke="#e7dfcf"/>
        <text x="14" y="22" font-size="14" font-weight="600" fill="#1f1815">CN-ETS · sources</text>
        <text x="14" y="42" font-size="11" fill="#7a665a">2026-04-25 16:03 · MEE bulletin tracker</text>
        <g transform="translate(360, 12)">
          <rect x="0" y="0" width="40" height="40" rx="10" fill="#ffffff" stroke="#e7dfcf"/>
          <text x="20" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#7a665a">×</text>
        </g>
      </g>
      <!-- row 4 -->
      <g transform="translate(0, 216)">
        <rect x="0" y="0" width="356" height="62" rx="14" fill="#ffffff" stroke="#e7dfcf"/>
        <text x="14" y="22" font-size="14" font-weight="600" fill="#1f1815">EU-ETS · drivers</text>
        <text x="14" y="42" font-size="11" fill="#7a665a">2026-04-22 10:31 · TTF gas + Brent overlay</text>
        <g transform="translate(360, 12)">
          <rect x="0" y="0" width="40" height="40" rx="10" fill="#ffffff" stroke="#e7dfcf"/>
          <text x="20" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#7a665a">×</text>
        </g>
      </g>
    </g>

    <!-- footer -->
    <line x1="0" y1="752" x2="420" y2="752" stroke="#e7dfcf"/>
    <rect x="0" y="752" width="420" height="48" fill="#f5f1e8"/>
    <g transform="translate(258, 762)">
      <rect x="0" y="0" width="140" height="28" rx="14" fill="#ffffff" stroke="#e7dfcf"/>
      <text x="70" y="19" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1f1815">Clear all</text>
    </g>
  </g>

  <!-- caption -->
  <g transform="translate(40, 700)" font-family="Inter, sans-serif">
    <text x="0" y="0" font-family="Fraunces, serif" font-size="22" font-weight="500" fill="#1f1815" letter-spacing="-0.4">Watchlist drawer</text>
    <text x="0" y="28" font-size="13" fill="#7a665a">⌘K → "Open watchlist" or "Pin current view to watchlist"</text>
    <text x="0" y="48" font-size="13" fill="#7a665a">Click any row to restore the saved surface + market combination.</text>
    <text x="0" y="68" font-size="13" fill="#7a665a">Up to 64 entries · stored at &lt;userData&gt;/watchlist.json</text>
  </g>
</svg>

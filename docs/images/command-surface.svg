<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="Command surface — cross-market board">
  <defs>
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d1612"/>
      <stop offset="100%" stop-color="#2a1f17"/>
    </linearGradient>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2e1e13" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- canvas (warm cream) -->
  <rect width="1280" height="800" fill="#faf9f5"/>

  <!-- side rail -->
  <rect x="0" y="0" width="228" height="800" fill="url(#railGrad)"/>

  <!-- rail brand -->
  <g transform="translate(20, 22)">
    <rect x="0" y="0" width="42" height="42" rx="14" fill="#0d0805"/>
    <path d="M 30 13 C 27 11, 23.5 10, 20.5 10 C 13.5 10, 8 15.5, 8 22.5 C 8 29.5, 13.5 35, 20.5 35 C 23.5 35, 27 34, 30 32 L 30 26 C 28 28, 25.5 29, 22.5 29 C 18 29, 14.5 25.5, 14.5 21 C 14.5 16.5, 18 13, 22.5 13 C 25.5 13, 28 14, 30 16 Z" fill="#c96442"/>
    <text x="56" y="20" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#f5ece0">C-Quant</text>
    <text x="56" y="36" font-family="Inter, sans-serif" font-size="11" fill="#a99d8c">Carbon desk</text>
  </g>

  <!-- rail label -->
  <text x="20" y="100" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#b4a18b">SCREENS</text>

  <!-- rail buttons -->
  <g font-family="Inter, sans-serif" font-size="13" font-weight="600">
    <!-- Command (active) -->
    <g transform="translate(14, 116)">
      <rect x="0" y="0" width="200" height="46" rx="14" fill="rgba(232,220,196,0.10)" stroke="rgba(232,220,196,0.16)"/>
      <rect x="0" y="0" width="3" height="46" fill="#c96442"/>
      <text x="14" y="28" fill="#ede1cf">Command</text>
    </g>
    <!-- Desk -->
    <g transform="translate(14, 168)">
      <rect x="0" y="0" width="200" height="46" rx="14" fill="rgba(232,220,196,0.025)" stroke="rgba(232,220,196,0.06)"/>
      <text x="14" y="28" fill="#ede1cf">Desk</text>
    </g>
    <!-- Drivers -->
    <g transform="translate(14, 220)">
      <rect x="0" y="0" width="200" height="46" rx="14" fill="rgba(232,220,196,0.025)" stroke="rgba(232,220,196,0.06)"/>
      <text x="14" y="28" fill="#ede1cf">Drivers</text>
    </g>
    <!-- Sources -->
    <g transform="translate(14, 272)">
      <rect x="0" y="0" width="200" height="46" rx="14" fill="rgba(232,220,196,0.025)" stroke="rgba(232,220,196,0.06)"/>
      <text x="14" y="28" fill="#ede1cf">Sources</text>
    </g>
  </g>

  <!-- rail label markets -->
  <text x="20" y="358" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#b4a18b">MARKETS</text>
  <g font-family="Inter, sans-serif" font-size="12">
    <text x="20" y="380" fill="#a99d8c">EU ETS</text>
    <text x="20" y="400" fill="#a99d8c">K-ETS</text>
    <text x="20" y="420" fill="#a99d8c">China ETS</text>
  </g>

  <!-- rail note -->
  <g transform="translate(14, 690)">
    <rect x="0" y="0" width="200" height="92" rx="14" fill="rgba(232,220,196,0.04)" stroke="rgba(232,220,196,0.06)"/>
    <text x="14" y="22" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#f5ece0">Today</text>
    <text x="14" y="44" font-family="Inter, sans-serif" font-size="11" fill="#c8b9a4">3 official anchors fresh</text>
    <text x="14" y="62" font-family="Inter, sans-serif" font-size="11" fill="#c8b9a4">1 listed proxy diverging</text>
    <text x="14" y="80" font-family="Inter, sans-serif" font-size="11" fill="#c8b9a4">No policy events queued</text>
  </g>

  <!-- main content -->
  <g transform="translate(248, 22)">
    <!-- eyebrow -->
    <text x="0" y="14" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#c96442">CARBON MISSION CONTROL</text>

    <!-- H1 -->
    <text x="0" y="58" font-family="Fraunces, serif" font-size="42" font-weight="500" letter-spacing="-1.2" fill="#1f1815">Global carbon decision desk</text>

    <!-- description -->
    <text x="0" y="86" font-family="Inter, sans-serif" font-size="14" fill="#7a665a">Read the official anchor for each ETS, then compare it against the live hedge tape.</text>

    <!-- live chip -->
    <g transform="translate(750, 32)">
      <rect x="0" y="0" width="148" height="36" rx="18" fill="#f1ddd1" stroke="rgba(201,100,66,0.22)"/>
      <circle cx="18" cy="18" r="4" fill="#c96442"/>
      <text x="32" y="23" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#6b3320">Live tape · 30s</text>
    </g>

    <!-- market strip -->
    <g transform="translate(0, 116)" font-family="Inter, sans-serif">
      <!-- EU ETS active -->
      <g filter="url(#cardShadow)">
        <rect x="0" y="0" width="320" height="76" rx="18" fill="#f1ddd1" stroke="#c96442" stroke-width="1.5"/>
        <rect x="0" y="0" width="3" height="76" fill="#c96442"/>
        <text x="16" y="22" font-size="11" font-weight="700" letter-spacing="1.5" fill="#6b3320">EU ETS</text>
        <text x="16" y="48" font-size="22" font-weight="600" fill="#1f1815">€ 78.42</text>
        <text x="16" y="66" font-size="11" fill="#7a665a">+1.8% · official anchor 1d</text>
      </g>
      <!-- K-ETS -->
      <g transform="translate(336, 0)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="320" height="76" rx="18" fill="#ffffff" stroke="#e7dfcf"/>
        <text x="16" y="22" font-size="11" font-weight="700" letter-spacing="1.5" fill="#7a665a">K-ETS</text>
        <text x="16" y="48" font-size="22" font-weight="600" fill="#1f1815">₩ 9,520</text>
        <text x="16" y="66" font-size="11" fill="#7a665a">−0.6% · official 2d</text>
      </g>
      <!-- China -->
      <g transform="translate(672, 0)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="320" height="76" rx="18" fill="#ffffff" stroke="#e7dfcf"/>
        <text x="16" y="22" font-size="11" font-weight="700" letter-spacing="1.5" fill="#7a665a">CN ETS</text>
        <text x="16" y="48" font-size="22" font-weight="600" fill="#1f1815">¥ 84.10</text>
        <text x="16" y="66" font-size="11" fill="#7a665a">+0.3% · bulletin 1d</text>
      </g>
    </g>

    <!-- chart panel -->
    <g transform="translate(0, 220)" font-family="Inter, sans-serif">
      <rect x="0" y="0" width="660" height="320" rx="22" fill="#ffffff" stroke="#e7dfcf" filter="url(#cardShadow)"/>
      <text x="20" y="32" font-family="Fraunces, serif" font-size="20" font-weight="500" fill="#1f1815" letter-spacing="-0.5">Anchor vs hedge tape</text>
      <text x="20" y="54" font-size="12" fill="#7a665a">EEX EU ETS auction · ICE EUA Dec — normalized to 100</text>

      <!-- chart area -->
      <g transform="translate(20, 80)">
        <!-- gridlines -->
        <line x1="0" y1="0" x2="620" y2="0" stroke="#e7dfcf" stroke-dasharray="3 3"/>
        <line x1="0" y1="50" x2="620" y2="50" stroke="#e7dfcf" stroke-dasharray="3 3"/>
        <line x1="0" y1="100" x2="620" y2="100" stroke="#e7dfcf" stroke-dasharray="3 3"/>
        <line x1="0" y1="150" x2="620" y2="150" stroke="#e7dfcf" stroke-dasharray="3 3"/>
        <line x1="0" y1="200" x2="620" y2="200" stroke="#e7dfcf" stroke-dasharray="3 3"/>
        <text x="-8" y="4" text-anchor="end" font-size="10" fill="#a89684">110</text>
        <text x="-8" y="104" text-anchor="end" font-size="10" fill="#a89684">100</text>
        <text x="-8" y="204" text-anchor="end" font-size="10" fill="#a89684">90</text>

        <!-- official line (solid orange) -->
        <path d="M 0 130 L 50 132 L 100 124 L 150 116 L 200 110 L 250 102 L 300 96 L 350 92 L 400 88 L 450 80 L 500 76 L 550 70 L 600 66"
              fill="none" stroke="#c96442" stroke-width="2.5" stroke-linecap="round"/>
        <!-- benchmark line (dashed) -->
        <path d="M 0 140 L 50 138 L 100 134 L 150 128 L 200 124 L 250 118 L 300 110 L 350 102 L 400 96 L 450 90 L 500 84 L 550 78 L 600 72"
              fill="none" stroke="#3d7a43" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>

        <!-- legend -->
        <g transform="translate(0, 230)" font-size="11" font-weight="600" fill="#3a2e26">
          <line x1="0" y1="-3" x2="22" y2="-3" stroke="#c96442" stroke-width="2.5"/>
          <text x="30" y="0">Official anchor</text>
          <line x1="180" y1="-3" x2="202" y2="-3" stroke="#3d7a43" stroke-width="2" stroke-dasharray="4 4"/>
          <text x="210" y="0">ICE EUA Dec proxy</text>
        </g>
      </g>
    </g>

    <!-- inspector right column -->
    <g transform="translate(680, 220)" font-family="Inter, sans-serif">
      <rect x="0" y="0" width="300" height="320" rx="22" fill="#ffffff" stroke="#e7dfcf" filter="url(#cardShadow)"/>

      <text x="20" y="32" font-family="Fraunces, serif" font-size="18" font-weight="500" fill="#1f1815" letter-spacing="-0.4">Decision memo</text>

      <!-- stance pill -->
      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="92" height="30" rx="15" fill="#3d7a43"/>
        <text x="46" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">BUY BIAS</text>
      </g>
      <text x="124" y="68" font-size="12" fill="#7a665a">Confidence 72%</text>

      <!-- support -->
      <text x="20" y="110" font-size="11" font-weight="700" letter-spacing="1.5" fill="#7a665a">SUPPORT</text>
      <g font-size="12" fill="#3a2e26">
        <text x="20" y="132">·  Official anchor +1.8% week-on-week</text>
        <text x="20" y="152">·  Tape direction match 86%</text>
        <text x="20" y="172">·  No supply-side risk events queued</text>
      </g>

      <!-- risks -->
      <text x="20" y="202" font-size="11" font-weight="700" letter-spacing="1.5" fill="#7a665a">RISKS</text>
      <g font-size="12" fill="#3a2e26">
        <text x="20" y="224">·  Auction calendar gap next 4 days</text>
        <text x="20" y="244">·  Free chart feed delay 15–30 min</text>
      </g>

      <!-- next check -->
      <g transform="translate(20, 260)">
        <rect x="0" y="0" width="260" height="40" rx="12" fill="#f5f1e8" stroke="#e7dfcf"/>
        <text x="14" y="17" font-size="10" font-weight="700" letter-spacing="1.5" fill="#7a665a">NEXT CHECK</text>
        <text x="14" y="32" font-size="12" font-weight="600" fill="#1f1815">EEX auction notice tomorrow 11:00 CET</text>
      </g>
    </g>

    <!-- bottom row: drivers + market context -->
    <g transform="translate(0, 564)" font-family="Inter, sans-serif">
      <rect x="0" y="0" width="430" height="200" rx="22" fill="#ffffff" stroke="#e7dfcf" filter="url(#cardShadow)"/>
      <text x="20" y="30" font-family="Fraunces, serif" font-size="16" font-weight="500" fill="#1f1815">Top drivers</text>

      <g transform="translate(20, 50)">
        <!-- driver row 1 -->
        <text x="0" y="14" font-size="12" font-weight="600" fill="#1f1815">Power · gas</text>
        <rect x="160" y="6" width="200" height="10" rx="5" fill="#f5f1e8"/>
        <rect x="160" y="6" width="148" height="10" rx="5" fill="#c96442"/>
        <text x="370" y="14" font-size="11" font-weight="600" fill="#3a2e26">+0.74</text>
        <!-- driver row 2 -->
        <text x="0" y="40" font-size="12" font-weight="600" fill="#1f1815">Auction supply</text>
        <rect x="160" y="32" width="200" height="10" rx="5" fill="#f5f1e8"/>
        <rect x="160" y="32" width="92" height="10" rx="5" fill="#3d7a43"/>
        <text x="370" y="40" font-size="11" font-weight="600" fill="#3a2e26">+0.46</text>
        <!-- driver row 3 -->
        <text x="0" y="66" font-size="12" font-weight="600" fill="#1f1815">Coal spread</text>
        <rect x="160" y="58" width="200" height="10" rx="5" fill="#f5f1e8"/>
        <rect x="160" y="58" width="60" height="10" rx="5" fill="#a87d18"/>
        <text x="370" y="66" font-size="11" font-weight="600" fill="#3a2e26">+0.30</text>
        <!-- driver row 4 -->
        <text x="0" y="92" font-size="12" font-weight="600" fill="#1f1815">FX (USD/EUR)</text>
        <rect x="160" y="84" width="200" height="10" rx="5" fill="#f5f1e8"/>
        <rect x="240" y="84" width="40" height="10" rx="5" fill="#b14d44"/>
        <text x="370" y="92" font-size="11" font-weight="600" fill="#3a2e26">−0.12</text>
        <!-- driver row 5 -->
        <text x="0" y="118" font-size="12" font-weight="600" fill="#1f1815">Weather</text>
        <rect x="160" y="110" width="200" height="10" rx="5" fill="#f5f1e8"/>
        <rect x="248" y="110" width="48" height="10" rx="5" fill="#7a665a"/>
        <text x="370" y="118" font-size="11" font-weight="600" fill="#3a2e26">+0.06</text>
      </g>
    </g>

    <g transform="translate(450, 564)" font-family="Inter, sans-serif">
      <rect x="0" y="0" width="270" height="200" rx="22" fill="#ffffff" stroke="#e7dfcf" filter="url(#cardShadow)"/>
      <text x="20" y="30" font-family="Fraunces, serif" font-size="16" font-weight="500" fill="#1f1815">Source freshness</text>

      <g transform="translate(20, 56)">
        <!-- chip -->
        <g>
          <rect x="0" y="0" width="80" height="28" rx="14" fill="#e2ecdc" stroke="rgba(61,122,67,0.3)"/>
          <text x="40" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="#3d7a43">EU · 1d</text>
        </g>
        <g transform="translate(86, 0)">
          <rect x="0" y="0" width="80" height="28" rx="14" fill="#e2ecdc" stroke="rgba(61,122,67,0.3)"/>
          <text x="40" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="#3d7a43">KR · 2d</text>
        </g>
        <g transform="translate(0, 36)">
          <rect x="0" y="0" width="80" height="28" rx="14" fill="#f3e7c5" stroke="rgba(168,125,24,0.3)"/>
          <text x="40" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="#a87d18">CN · 3d</text>
        </g>
        <g transform="translate(86, 36)">
          <rect x="0" y="0" width="92" height="28" rx="14" fill="#f1ddd1" stroke="rgba(201,100,66,0.3)"/>
          <text x="46" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="#6b3320">Proxy · 30s</text>
        </g>
        <text x="0" y="92" font-size="12" fill="#3a2e26">All anchors within freshness window. Listed proxy delay ≤ 30 min.</text>
      </g>
    </g>

    <g transform="translate(740, 564)" font-family="Inter, sans-serif">
      <rect x="0" y="0" width="240" height="200" rx="22" fill="#ffffff" stroke="#e7dfcf" filter="url(#cardShadow)"/>
      <text x="20" y="30" font-family="Fraunces, serif" font-size="16" font-weight="500" fill="#1f1815">Score build</text>
      <g transform="translate(120, 110)">
        <circle cx="0" cy="0" r="58" fill="none" stroke="#f5f1e8" stroke-width="14"/>
        <circle cx="0" cy="0" r="58" fill="none" stroke="#c96442" stroke-width="14"
                stroke-dasharray="265 364" transform="rotate(-90)" stroke-linecap="round"/>
        <text x="0" y="-2" text-anchor="middle" font-family="Fraunces, serif" font-size="28" font-weight="500" fill="#1f1815">72</text>
        <text x="0" y="18" text-anchor="middle" font-size="11" fill="#7a665a">confidence</text>
      </g>
    </g>
  </g>

  <!-- floating theme toggle -->
  <g transform="translate(1180, 754)">
    <rect x="0" y="0" width="80" height="32" rx="16" fill="#f5f1e8" stroke="#e7dfcf"/>
    <text x="14" y="20" font-family="Inter, sans-serif" font-size="13" fill="#1f1815">☀ Theme</text>
  </g>
</svg>

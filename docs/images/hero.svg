<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="C-Quant — Carbon decision desk for EU, Korea, and China">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf9f5"/>
      <stop offset="100%" stop-color="#f1ece1"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c96442"/>
      <stop offset="100%" stop-color="#b45638"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c96442" stop-opacity="0"/>
      <stop offset="20%" stop-color="#c96442" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c96442"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#2e1e13" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="420" fill="url(#bgGrad)"/>

  <!-- decorative chart trace -->
  <g opacity="0.85" filter="url(#softShadow)">
    <path d="M 60 320 L 130 305 L 200 312 L 270 282 L 340 270 L 410 254 L 480 232 L 550 218 L 620 178 L 690 168 L 760 152 L 830 130 L 900 138 L 970 122 L 1040 108 L 1110 90 L 1180 84 L 1220 76"
          fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- area fill below -->
    <path d="M 60 320 L 130 305 L 200 312 L 270 282 L 340 270 L 410 254 L 480 232 L 550 218 L 620 178 L 690 168 L 760 152 L 830 130 L 900 138 L 970 122 L 1040 108 L 1110 90 L 1180 84 L 1220 76 L 1220 360 L 60 360 Z"
          fill="#c96442" opacity="0.06"/>
    <!-- markers -->
    <circle cx="620" cy="178" r="4" fill="#c96442"/>
    <circle cx="900" cy="138" r="4" fill="#c96442"/>
    <circle cx="1220" cy="76" r="5" fill="#c96442"/>
    <circle cx="1220" cy="76" r="9" fill="none" stroke="#c96442" stroke-width="1.5" opacity="0.45"/>
  </g>

  <!-- mark -->
  <g transform="translate(60, 86)">
    <rect x="0" y="0" width="92" height="92" rx="22" fill="#1d1612"/>
    <path d="M 65 26 C 60 22, 53 20, 47 20 C 33 20, 22 31, 22 45 C 22 59, 33 70, 47 70 C 53 70, 60 68, 65 64 L 65 52 C 61 56, 56 58, 50 58 C 41 58, 34 51, 34 42 C 34 33, 41 26, 50 26 C 56 26, 61 28, 65 32 Z"
          fill="url(#orangeGrad)"/>
  </g>

  <!-- title group -->
  <g transform="translate(180, 110)">
    <text x="0" y="0"
          font-family="'Fraunces', 'Source Serif 4', 'Georgia', serif"
          font-size="76"
          font-weight="500"
          fill="#1f1815"
          letter-spacing="-2.5">C-Quant</text>

    <text x="2" y="44"
          font-family="'Inter', system-ui, -apple-system, sans-serif"
          font-size="20"
          font-weight="600"
          fill="#7a665a"
          letter-spacing="0.5">Carbon decision desk · EU ETS · K-ETS · China ETS</text>

    <text x="2" y="92"
          font-family="'Inter', system-ui, -apple-system, sans-serif"
          font-size="16"
          fill="#3a2e26"
          letter-spacing="0">Read the official anchor first. Compare it with listed proxies. See the drivers.</text>
    <text x="2" y="116"
          font-family="'Inter', system-ui, -apple-system, sans-serif"
          font-size="16"
          fill="#3a2e26"
          letter-spacing="0">Decide whether the desk leans buy, hold, or reduce — with the source freshness behind every datum.</text>
  </g>

  <!-- product chips -->
  <g transform="translate(180, 318)">
    <g>
      <rect x="0" y="0" width="200" height="40" rx="20" fill="#ffffff" stroke="#e7dfcf"/>
      <circle cx="22" cy="20" r="5" fill="#c96442"/>
      <text x="36" y="25" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#1f1815">Official anchor first</text>
    </g>
    <g transform="translate(216, 0)">
      <rect x="0" y="0" width="174" height="40" rx="20" fill="#ffffff" stroke="#e7dfcf"/>
      <circle cx="22" cy="20" r="5" fill="#3d7a43"/>
      <text x="36" y="25" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#1f1815">Source freshness</text>
    </g>
    <g transform="translate(406, 0)">
      <rect x="0" y="0" width="142" height="40" rx="20" fill="#ffffff" stroke="#e7dfcf"/>
      <circle cx="22" cy="20" r="5" fill="#a87d18"/>
      <text x="36" y="25" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#1f1815">No brokerage</text>
    </g>
    <g transform="translate(564, 0)">
      <rect x="0" y="0" width="184" height="40" rx="20" fill="#ffffff" stroke="#e7dfcf"/>
      <circle cx="22" cy="20" r="5" fill="#1d1612"/>
      <text x="36" y="25" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#1f1815">Explain, then signal</text>
    </g>
  </g>

  <!-- accent label top right -->
  <g transform="translate(1180, 60)">
    <rect x="-130" y="-22" width="120" height="32" rx="16" fill="#1d1612"/>
    <text x="-70" y="-2" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#f5ece0" letter-spacing="2">DESKTOP · MIT</text>
  </g>
</svg>

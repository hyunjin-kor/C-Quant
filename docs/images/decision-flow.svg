<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Four-step decision workflow: anchor, compare, drivers, decide">
  <defs>
    <filter id="stepShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2e1e13" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="#faf9f5"/>

  <!-- title -->
  <text x="640" y="56" text-anchor="middle" font-family="Fraunces, serif" font-size="32" font-weight="500" letter-spacing="-1" fill="#1f1815">The four-step decision workflow</text>
  <text x="640" y="84" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#7a665a">Every C-Quant session walks the same path. Official first, listed second, drivers third, decision fourth.</text>

  <!-- step 1 -->
  <g transform="translate(70, 140)" filter="url(#stepShadow)">
    <rect x="0" y="0" width="260" height="220" rx="22" fill="#ffffff" stroke="#e7dfcf"/>
    <circle cx="36" cy="38" r="22" fill="#1d1612"/>
    <text x="36" y="44" text-anchor="middle" font-family="Fraunces, serif" font-size="20" font-weight="500" fill="#c96442">1</text>
    <text x="20" y="92" font-family="Fraunces, serif" font-size="22" font-weight="500" letter-spacing="-0.5" fill="#1f1815">Read the anchor</text>
    <text x="20" y="124" font-family="Inter, sans-serif" font-size="13" fill="#3a2e26">Official EEX auction tape,</text>
    <text x="20" y="142" font-family="Inter, sans-serif" font-size="13" fill="#3a2e26">KRX bydd_trd, MEE bulletin.</text>
    <text x="20" y="180" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#7a665a">SURFACE</text>
    <text x="20" y="200" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#c96442">Command · Sources</text>
  </g>

  <!-- arrow 1 -->
  <g transform="translate(348, 246)">
    <line x1="0" y1="0" x2="42" y2="0" stroke="#c96442" stroke-width="2"/>
    <path d="M 38 -5 L 50 0 L 38 5 Z" fill="#c96442"/>
  </g>

  <!-- step 2 -->
  <g transform="translate(410, 140)" filter="url(#stepShadow)">
    <rect x="0" y="0" width="260" height="220" rx="22" fill="#ffffff" stroke="#e7dfcf"/>
    <circle cx="36" cy="38" r="22" fill="#1d1612"/>
    <text x="36" y="44" text-anchor="middle" font-family="Fraunces, serif" font-size="20" font-weight="500" fill="#c96442">2</text>
    <text x="20" y="92" font-family="Fraunces, serif" font-size="22" font-weight="500" letter-spacing="-0.5" fill="#1f1815">Compare the tape</text>
    <text x="20" y="124" font-family="Inter, sans-serif" font-size="13" fill="#3a2e26">ICE EUA, KRBN, KEUA, CO2.L</text>
    <text x="20" y="142" font-family="Inter, sans-serif" font-size="13" fill="#3a2e26">overlaid, normalized to 100.</text>
    <text x="20" y="180" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#7a665a">SURFACE</text>
    <text x="20" y="200" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#c96442">Command · Desk</text>
  </g>

  <!-- arrow 2 -->
  <g transform="translate(688, 246)">
    <line x1="0" y1="0" x2="42" y2="0" stroke="#c96442" stroke-width="2"/>
    <path d="M 38 -5 L 50 0 L 38 5 Z" fill="#c96442"/>
  </g>

  <!-- step 3 -->
  <g transform="translate(750, 140)" filter="url(#stepShadow)">
    <rect x="0" y="0" width="260" height="220" rx="22" fill="#ffffff" stroke="#e7dfcf"/>
    <circle cx="36" cy="38" r="22" fill="#1d1612"/>
    <text x="36" y="44" text-anchor="middle" font-family="Fraunces, serif" font-size="20" font-weight="500" fill="#c96442">3</text>
    <text x="20" y="92" font-family="Fraunces, serif" font-size="22" font-weight="500" letter-spacing="-0.5" fill="#1f1815">Read the drivers</text>
    <text x="20" y="124" font-family="Inter, sans-serif" font-size="13" fill="#3a2e26">Power, gas, coal, weather,</text>
    <text x="20" y="142" font-family="Inter, sans-serif" font-size="13" fill="#3a2e26">macro, policy events.</text>
    <text x="20" y="180" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#7a665a">SURFACE</text>
    <text x="20" y="200" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#c96442">Drivers</text>
  </g>

  <!-- arrow 3 -->
  <g transform="translate(1028, 246)">
    <line x1="0" y1="0" x2="42" y2="0" stroke="#c96442" stroke-width="2"/>
    <path d="M 38 -5 L 50 0 L 38 5 Z" fill="#c96442"/>
  </g>

  <!-- step 4 -->
  <g transform="translate(1090, 140)" filter="url(#stepShadow)">
    <rect x="0" y="0" width="120" height="220" rx="22" fill="#1d1612" stroke="#1d1612"/>
    <circle cx="36" cy="38" r="22" fill="#c96442"/>
    <text x="36" y="44" text-anchor="middle" font-family="Fraunces, serif" font-size="20" font-weight="500" fill="#1d1612">4</text>
    <text x="20" y="92" font-family="Fraunces, serif" font-size="20" font-weight="500" letter-spacing="-0.4" fill="#f5ece0">Decide</text>
    <g transform="translate(20, 116)">
      <rect x="0" y="0" width="80" height="22" rx="11" fill="#3d7a43"/>
      <text x="40" y="15" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff">BUY</text>
    </g>
    <g transform="translate(20, 144)">
      <rect x="0" y="0" width="80" height="22" rx="11" fill="#a87d18"/>
      <text x="40" y="15" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff">HOLD</text>
    </g>
    <g transform="translate(20, 172)">
      <rect x="0" y="0" width="80" height="22" rx="11" fill="#b14d44"/>
      <text x="40" y="15" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff">REDUCE</text>
    </g>
  </g>
</svg>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is the primary target. mac/linux are advisory:
        # they run the same gates but are allowed to fail until the
        # cross-platform packaging story stabilizes.
        include:
          - os: windows-latest
            primary: true
          - os: macos-latest
            primary: false
          - os: ubuntu-latest
            primary: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check
        continue-on-error: ${{ !matrix.primary }}

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Format check
        run: npm run format:check
        continue-on-error: true

      - name: Unit tests (vitest)
        run: npm test
        continue-on-error: ${{ !matrix.primary }}

      - name: Localization tests (node:test)
        run: npm run test:node
        continue-on-error: ${{ !matrix.primary }}

      - name: Syntax check (Electron entrypoints)
        run: npm run ci:verify
        continue-on-error: ${{ !matrix.primary }}

      - name: Build renderer
        run: npm run build
        continue-on-error: ${{ !matrix.primary }}

      - name: Bundle size budget
        run: npm run bundle:check
        continue-on-error: ${{ !matrix.primary }}

  e2e:
    name: E2E smoke (windows)
    runs-on: windows-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Run Playwright smoke
        run: npm run e2e
        continue-on-error: true
        env:
          CQUANT_DISABLE_UPDATER: "1"
